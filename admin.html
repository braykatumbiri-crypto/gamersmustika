<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Moderator · Mustika Gamers</title>
<style>
:root{--bg:#0b0a14;--panel:#15132a;--panel2:#1f1c3d;--ink:#efeaff;--muted:#a29bc6;--jade:#3ee0a1;--blood:#ff4d6d;--line:#34305f;color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-left,0px))}
main{max-width:980px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h2{font-size:15px;margin:26px 0 8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
input,select{padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
button.p{background:var(--jade);color:#04170f;border:0;font-weight:700;padding:10px 16px}
button.d{border-color:var(--blood);color:var(--blood)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:560px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{color:var(--blood);margin:8px 0 0}.mut{color:var(--muted)}
</style>
<main>
 <h1>Panel Moderator</h1><p class="mut">Mustika Gamers. Hanya untuk moderator dan admin.</p>
 <form id="lf" class="card row"><input id="u" placeholder="Nama akun" autocomplete="username"><input id="p" type="password" placeholder="Kata sandi" autocomplete="current-password"><button class="p" type="submit">Masuk</button><span id="le" class="err"></span></form>
 <section id="app" hidden>
  <p class="mut" id="who"></p>
  <h2>Pemain online</h2><div class="card tw"><table><thead><tr><th>Nama</th><th>Kelas</th><th>Ruang</th><th>Game</th><th>Akun</th><th>Tindakan</th></tr></thead><tbody id="online"></tbody></table></div>
  <h2>Laporan terbaru</h2><div class="card tw"><table><thead><tr><th>Waktu</th><th>Ruang</th><th>Pelapor</th><th>Dilaporkan</th><th>Akun</th></tr></thead><tbody id="reps"></tbody></table></div>
  <div id="adm" hidden><h2>Akun terdaftar</h2><div class="card tw"><table><thead><tr><th>Akun</th><th>Nama</th><th>Peran</th><th>Status</th><th>Tindakan</th></tr></thead><tbody id="users"></tbody></table></div></div>
 </section>
</main>
<script>
let T=null;const $=s=>document.querySelector(s);
const api=(u,b)=>fetch(u,{method:b?'POST':'GET',headers:Object.assign({authorization:'Bearer '+T},b?{'content-type':'application/json'}:{}),body:b?JSON.stringify(b):undefined}).then(r=>r.json());
function td(r,t){const c=document.createElement('td');if(typeof t==='string')c.textContent=t;else c.append(t);r.append(c)}
function btn(t,f,cls){const b=document.createElement('button');b.type='button';b.textContent=t;if(cls)b.className=cls;b.onclick=async()=>{const j=await f();if(j&&!j.ok)alert(j.error||'Gagal');load()};return b}
async function load(){
 const j=await api('/api/admin/state');if(!j.ok){$('#app').hidden=true;return}
 $('#who').textContent='Masuk sebagai '+j.me.user+' ('+j.me.role+')';
 const on=$('#online');on.innerHTML='';
 if(!j.online.length){const r=on.insertRow();td(r,'Belum ada pemain online.')}
 j.online.forEach(o=>{const r=on.insertRow();td(r,o.name||'-');td(r,o.kelas||'-');td(r,o.room);td(r,o.mode);td(r,o.user||'tamu');
  const a=document.createElement('div');a.className='row';
  a.append(btn('Bisukan 10 mnt',()=>api('/api/admin/mute',{id:o.id,minutes:10})),btn('Keluarkan',()=>api('/api/admin/kick',{id:o.id}),'d'));td(r,a)});
 const rp=$('#reps');rp.innerHTML='';
 if(!j.reports.length){const r=rp.insertRow();td(r,'Belum ada laporan.')}
 j.reports.forEach(x=>{const r=rp.insertRow();td(r,new Date(x.at).toLocaleString('id-ID'));td(r,x.room);td(r,x.by);td(r,x.target+(x.targetKelas?' ('+x.targetKelas+')':''));td(r,x.targetUser||'tamu')});
 $('#adm').hidden=j.me.role!=='admin';
 const us=$('#users');us.innerHTML='';
 j.users.forEach(u=>{const r=us.insertRow();td(r,u.user);td(r,u.display);td(r,u.role);td(r,u.banUntil>Date.now()?'Diblokir sampai '+new Date(u.banUntil).toLocaleString('id-ID'):'Aktif');
  const a=document.createElement('div');a.className='row';
  if(u.role!=='admin'){a.append(btn(u.role==='mod'?'Jadikan pemain':'Jadikan moderator',()=>api('/api/admin/role',{username:u.user,role:u.role==='mod'?'player':'mod'})));
   a.append(u.banUntil>Date.now()?btn('Buka blokir',()=>api('/api/admin/ban',{username:u.user,minutes:0})):btn('Blokir 1 hari',()=>api('/api/admin/ban',{username:u.user,minutes:1440}),'d'))}
  td(r,a)});
}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
 const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#u').value,password:$('#p').value})});const j=await r.json();
 if(!j.ok)return $('#le').textContent=j.error||'Gagal masuk.';
 if(j.role!=='mod'&&j.role!=='admin')return $('#le').textContent='Akun ini bukan moderator.';
 T=j.token;$('#lf').hidden=true;$('#app').hidden=false;load();setInterval(load,5000)};
</script>
